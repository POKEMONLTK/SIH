<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1612"/>
      <stop offset="100%" stop-color="#040807"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6f041"/>
      <stop offset="100%" stop-color="#92d61b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#92d61b" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Radar Range Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1d2d26" stroke-width="3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#2a3f35" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#92d61b" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Tactical Reticle / Crosshair -->
  <line x1="256" y1="40" x2="256" y2="150" stroke="#92d61b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="362" x2="256" y2="472" stroke="#92d61b" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="150" y2="256" stroke="#92d61b" stroke-width="4" stroke-linecap="round"/>
  <line x1="362" y1="256" x2="472" y2="256" stroke="#92d61b" stroke-width="4" stroke-linecap="round"/>

  <!-- 155mm Munition / Canard Profile (Stylized Center) -->
  <g transform="translate(256,256)" filter="url(#glow)">
    <!-- Shell Centerbody -->
    <path d="M -18,-70 Q 0,-100 18,-70 L 18,50 L -18,50 Z" fill="url(#neonGrad)"/>
    <rect x="-16" y="52" width="32" height="24" rx="2" fill="#78b214"/>
    <!-- 4 Canard Wings -->
    <polygon points="-18,-25 -65,-5 -60,15 -18,0" fill="#92d61b"/>
    <polygon points="18,-25 65,-5 60,15 18,0" fill="#92d61b"/>
    <polygon points="-18,20 -50,35 -45,48 -18,32" fill="#78b214"/>
    <polygon points="18,20 50,35 45,48 18,32" fill="#78b214"/>
    <!-- Center Optics Dot -->
    <circle cx="0" cy="-60" r="5" fill="#ffffff"/>
  </g>

  <!-- Typography Badge -->
  <text x="256" y="440" text-anchor="middle" font-family="monospace" font-size="28" font-weight="900" fill="#92d61b" letter-spacing="4">155MM PGK</text>
  <text x="256" y="468" text-anchor="middle" font-family="monospace" font-size="14" fill="#678074" letter-spacing="2">SIH26098 · GNC</text>
</svg>
